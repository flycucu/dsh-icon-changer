name: check

# The plugin itself is Windows-only (WMI + PowerShell 5.1 + PE resource editing),
# but the JavaScript halves are plain ESM and can be syntax-checked anywhere.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check (host + client halves)
        run: npm run check
